<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF4EC"><title>加密票据包生成器</title><style>
:root{--bg:#fff4ec;--surface:#fffdf9;--ink:#25364a;--muted:#64748a;--brand:#b74334;--soft:#ffe0d7;--line:rgba(107,70,49,.16)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#ffe5d1,transparent 32rem),var(--bg);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.wrap{width:min(100% - 28px,720px);margin:auto;padding:22px 0 60px}a{color:var(--brand);font-weight:800;text-decoration:none}.eyebrow{color:var(--brand);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(28px,7vw,50px);line-height:1.05;letter-spacing:-.04em;margin:30px 0 10px}.lede,.hint{color:var(--muted);line-height:1.7}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 15px 40px rgba(107,70,49,.1);margin-top:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row h2{font-size:18px;margin:0}.files{margin:14px 0;display:grid;gap:7px}.file{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;background:#fff0e4;font-size:12px;overflow-wrap:anywhere}.file b{color:var(--brand)}label{display:block;font-weight:800;margin:16px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--surface);color:var(--ink)}.pass{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{margin-top:18px;border:0;border-radius:12px;background:var(--brand);color:#fff8f0;padding:13px 16px;font-weight:850;width:100%;cursor:pointer}.status{min-height:24px;margin-top:10px;color:var(--muted);font-size:13px}.status.error{color:#a03126}.status.ok{color:#26745a}.warn{background:#fff0cf;border:1px solid #e7c578;border-radius:13px;padding:12px;font-size:12px;line-height:1.65;color:#795914}@media(max-width:520px){.wrap{width:min(100% - 20px,720px)}.pass{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a href="tickets.html">← 返回私密票据库</a><div class="eyebrow" style="margin-top:40px">LOCAL ENCRYPTION TOOL</div><h1>在你的设备上<br>生成加密票据包。</h1><p class="lede">选择票据原件，输入一个你自己保管的密码。浏览器会在本机使用 AES-GCM 加密，下载的 <b>tickets.enc.json</b> 不包含明文内容和密码。</p><div class="warn">密码不会显示给我，也不会写入网址。忘记密码无法恢复票据，请把密码保存在自己的密码管理器中。</div><section class="panel"><div class="row"><h2>1 · 选择票据原件</h2><span id="count" class="eyebrow">0 份</span></div><input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.pdf,.webp"><div id="list" class="files"><div class="hint">可一次选择 D:\Desktop 中的所有旅行票据。</div></div><label for="password">2 · 设置票据库密码</label><div class="pass"><input id="password" type="password" autocomplete="new-password" placeholder="输入密码"><input id="confirm" type="password" autocomplete="new-password" placeholder="再次输入"></div><button id="make" class="primary" type="button">生成并下载加密包</button><div id="status" class="status" role="status"></div></section></main><script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),b64=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)};let chosen=[];const cat=n=>/签证/.test(n)?'签证':/无忧保|保险/.test(n)?'保险':/住宿|hotel/.test(n)?'住宿':/门票|歌剧院|普芬|大洋路|南线|观光飞机|higher ground|reservation/i.test(n)?'活动与门票':/机票|机场|飞行/.test(n)?'交通票据':'其他';const date=n=>(n.match(/2026\d{4}/)||[])[0]?.replace(/(2026)(\d{2})(\d{2})/,'$1-$2-$3')||'旅行资料';function status(t,k=''){$('#status').textContent=t;$('#status').className='status '+k}$('#files').onchange=e=>{chosen=[...e.target.files];$('#count').textContent=chosen.length+' 份';$('#list').innerHTML=chosen.map(f=>`<div class="file"><b>${cat(f.name)}</b><span>${f.name}</span></div>`).join('')||'<div class="hint">尚未选择文件。</div>'};$('#make').onclick=async()=>{if(!chosen.length)return status('请先选择文件。','error');const p=$('#password').value;if(!p||p.length<10)return status('请设置至少 10 位密码。','error');if(p!==$('#confirm').value)return status('两次密码不一致。','error');status('正在本机加密，请保持页面打开…');try{const salt=crypto.getRandomValues(new Uint8Array(16)),base=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);const items=[];for(const f of chosen){const bytes=await f.arrayBuffer(),payload=enc.encode(JSON.stringify({name:f.name,category:cat(f.name),date:date(f.name),mime:f.type||'application/octet-stream',data:b64(bytes)})),iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload);items.push({iv:b64(iv),data:b64(cipher)})}const blob=new Blob([JSON.stringify({format:'au-trip-ticket-v1',kdf:'PBKDF2-SHA-256',iterations:310000,salt:b64(salt),cipher:'AES-GCM-256',items})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tickets.enc.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('已生成 tickets.enc.json。把它导入票据库，或将它作为加密文件上传到网站。','ok')}catch(e){status('加密失败，请确认浏览器使用 HTTPS 后重试。','error')}};
</script></body></html>
